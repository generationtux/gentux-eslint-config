name: Publish to npm

on:
  push:
    branches: [master]

# Serialize publishes: two merges in quick succession would otherwise race,
# and the loser dies on "cannot publish over the previously published versions".
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No dependency caching in a job that publishes: a poisoned cache could
      # expose the OIDC token to attacker-controlled code (setup-node OIDC docs).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Publish to npm
        run: npm publish --loglevel silly
