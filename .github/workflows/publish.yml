name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No registry-url on purpose. It only exists to write an
      # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, which OIDC does not use —
      # and since setup-node v7 stopped exporting a dummy NODE_AUTH_TOKEN, Yarn
      # Classic hard-fails on the unresolvable variable ("Failed to replace env in
      # config"). npm publishes to registry.npmjs.org by default anyway.
      #
      # No dependency caching in a job that publishes: a poisoned cache could
      # expose the OIDC token to attacker-controlled code (setup-node OIDC docs).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # No --provenance flag: after a successful OIDC exchange npm auto-enables
      # provenance for public packages in public repos (lib/utils/oidc.js), so the
      # flag is redundant here.
      #
      # The trusted publisher on npmjs.com must have `npm publish` in its Allowed
      # actions, or this fails with a bare auth error.
      #
      # npm swallows OIDC failures at default log level (they log at verbose/silly
      # and return undefined), so a misconfigured trusted publisher surfaces only
      # as a bare auth error -- ENEEDAUTH, or E404 when the publisher identity
      # (owner/repo/workflow/environment) does not match. Safe to drop once proven.
      - name: Publish to npm
        run: npm publish --loglevel verbose
