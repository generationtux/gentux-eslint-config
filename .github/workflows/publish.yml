name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # Trusted publishing needs npm >= 11.5.1, which requires a newer Node than
      # the version this package targets. Publish on its own toolchain so the
      # tests above keep running against .nvmrc. Node 24 bundles npm 11.6.x.
      - name: Setup Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc even when no
      # token is supplied. npm reads the empty value as "auth already configured",
      # skips the OIDC exchange and fails with ENEEDAUTH.
      # https://github.com/actions/setup-node/issues/1551
      - name: Drop empty authToken so npm uses OIDC
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      # npm swallows OIDC failures at default log level (they log at verbose/silly
      # and return undefined), so a misconfigured trusted publisher surfaces only
      # as a bare ENEEDAUTH. Safe to drop once the path is proven.
      - name: Publish to npm
        run: npm publish --provenance --loglevel verbose
