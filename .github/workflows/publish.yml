name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # .nvmrc pins Node 24, which bundles the npm >= 11.5.1 that trusted
      # publishing requires.
      #
      # No dependency caching in a job that publishes: a poisoned cache could
      # expose the OIDC token to attacker-controlled code (setup-node OIDC docs).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # No --provenance flag: after a successful OIDC exchange npm auto-enables
      # provenance for public packages in public repos (lib/utils/oidc.js), so the
      # flag is redundant here.
      #
      # The trusted publisher on npmjs.com must have `npm publish` in its Allowed
      # actions, or this fails with a bare auth error.
      #
      # npm swallows OIDC failures at default log level (they log at verbose/silly
      # and return undefined), so a misconfigured trusted publisher surfaces only
      # as a bare ENEEDAUTH. Safe to drop once the path is proven.
      - name: Publish to npm
        run: npm publish --loglevel verbose
