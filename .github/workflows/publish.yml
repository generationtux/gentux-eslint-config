name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      # Trusted publishing needs npm >= 11.5.1, which requires a newer Node than
      # the version this package targets. Publish on its own toolchain so the
      # tests above keep running against .nvmrc. Node 24.18 bundles npm 11.16.x.
      # v7 or newer is required: v4-v6 export a dummy NODE_AUTH_TOKEN placeholder
      # that npm sends to the registry, breaking the OIDC publish
      # (actions/setup-node#1551, fixed by PR #1558).
      #
      # package-manager-cache: false per setup-node's own OIDC guidance — a poisoned
      # cache could expose the OIDC token to attacker-controlled code.
      - name: Setup Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24.18'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # No --provenance flag: after a successful OIDC exchange npm auto-enables
      # provenance for public packages in public repos (lib/utils/oidc.js), so the
      # flag is redundant here.
      #
      # The trusted publisher on npmjs.com must have `npm publish` in its Allowed
      # actions, or this fails with a bare auth error.
      #
      # npm swallows OIDC failures at default log level (they log at verbose/silly
      # and return undefined), so a misconfigured trusted publisher surfaces only
      # as a bare ENEEDAUTH. Safe to drop once the path is proven.
      - name: Publish to npm
        run: npm publish --loglevel verbose
